name: voucher-ledger-ddd

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    secrets:
      - postgres-password
    ports:
      - "${APP_PORT:-3000}:3000"

  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - ../filemaker/exports:/app/filemaker/exports:ro

volumes:
  postgres-data:

secrets:
  postgres-password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE in .env.docker}
